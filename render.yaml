services:
  - type: keyvalue
    name: comcesa-redis
    plan: free
    ipAllowList: []

  - type: web
    name: comcesa-inventario
    runtime: docker
    dockerfilePath: ./docker/backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CORS_ORIGIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SEED_DEMO_DATA
        value: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Base de datos en Neon (gratis, sin vencimiento). Pegar la cadena de conexion en el panel de Render.
      - key: DATABASE_URL
        sync: false
      # Correo para "olvide mi contrasena" (opcional, ej. Gmail con contrasena de aplicacion)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: REDIS_URL
        fromService:
          name: comcesa-redis
          type: keyvalue
          property: connectionString
