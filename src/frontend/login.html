<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Acceso seguro al portal COMCESA">
  <title>COMCESA | Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page-shell">
    <section class="login-layout" aria-labelledby="login-title">
      <div class="brand-panel">
        <div class="brand-mark" aria-label="COMCESA">C<span>O</span>MCESA</div>
        <p class="brand-kicker">Componentes de Centroamérica, S.A.</p>
        <div class="brand-line"></div>
        <p class="brand-copy">Consulta de inventario y existencias para una operación más clara, rápida y conectada.</p>
      </div>
      <div class="login-panel">
        <div class="panel-heading">
          <span class="eyebrow">Portal interno</span>
          <h1 id="login-title">Bienvenido</h1>
          <p>Ingresa con tus credenciales para consultar el inventario.</p>
        </div>
        <form id="login-form" class="form-stack">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="username" required maxlength="254" placeholder="nombre@empresa.com">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200" placeholder="Tu contraseña">
          <button id="login-button" class="primary-button" type="submit">Ingresar <span aria-hidden="true">→</span></button>
          <p id="login-message" class="form-message" role="alert" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>
  <script src="/login.js?v=1" defer></script>
</body>
</html>
