<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#063b68">
  <title>COMCESA | Recuperar contraseña</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=3">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Inventario">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
  <main class="page-shell">
    <section class="login-layout">
      <div class="brand-panel">
        <img class="brand-logo" src="/comcesa-logo.png" alt="COMCESA">
        <p class="brand-kicker">Componentes de Centroamérica, S.A.</p>
        <div class="brand-line"></div>
      </div>
      <div class="login-panel">
        <div class="panel-heading">
          <span class="eyebrow">Portal interno</span>
          <h1>¿Olvidaste tu contraseña?</h1>
          <p>Pide a un administrador que la restablezca. Te dará una contraseña temporal y el sistema te pedirá cambiarla al entrar.</p>
        </div>
        <div class="form-stack">
          <a class="primary-button" href="/login" style="text-align:center;text-decoration:none;display:block">Volver a iniciar sesión</a>
        </div>
      </div>
    </section>
  </main>
  <script src="/pwa.js" defer></script>
</body>
</html>
