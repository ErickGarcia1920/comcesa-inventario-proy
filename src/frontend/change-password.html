<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COMCESA | Cambiar contraseña</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page-shell">
    <section class="login-layout">
      <div class="brand-panel">
        <img class="brand-logo" src="/comcesa-logo.png" alt="COMCESA">
        <p class="brand-kicker">Componentes de Centroamerica, S.A.</p>
        <div class="brand-line"></div>
      </div>
      <div class="login-panel">
        <div class="panel-heading">
          <span class="eyebrow">Portal interno</span>
          <h1>Cambia tu contraseña</h1>
          <p>Por seguridad, define tu propia contraseña para continuar.</p>
        </div>
        <form id="form" class="form-stack">
          <label for="current">Contraseña actual</label>
          <input id="current" type="password" autocomplete="current-password" required maxlength="200">
          <label for="new">Nueva contraseña</label>
          <input id="new" type="password" autocomplete="new-password" required minlength="10" maxlength="200" placeholder="Mínimo 10 caracteres, con letras y números">
          <label for="confirm">Confirmar nueva contraseña</label>
          <input id="confirm" type="password" autocomplete="new-password" required minlength="10" maxlength="200">
          <button id="submit" class="primary-button" type="submit">Guardar contraseña <span aria-hidden="true">→</span></button>
          <p id="message" class="form-message" role="alert" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>
  <script src="/change-password.js?v=1" defer></script>
</body>
</html>
